services:
  db:
    image: postgres:17-alpine
    container_name: dbzenith-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dbzenith}
      POSTGRES_USER: ${POSTGRES_USER:-dbzenith}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_dev_only}
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "compute_query_id=on", "-c", "pg_stat_statements.track=all", "-c", "pg_stat_statements.max=10000", "-c", "track_io_timing=on"]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dbzenith} -d ${POSTGRES_DB:-dbzenith}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  sandbox-db:
    image: postgres:17-alpine
    container_name: dbzenith-sandbox-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SANDBOX_POSTGRES_DB:-dbzenith_sandbox}
      POSTGRES_USER: ${SANDBOX_POSTGRES_USER:-dbzenith_sandbox}
      POSTGRES_PASSWORD: ${SANDBOX_POSTGRES_PASSWORD:-change_me_sandbox_only}
    volumes:
      - sandbox_db_data:/var/lib/postgresql/data
    networks:
      - sandbox_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SANDBOX_POSTGRES_USER:-dbzenith_sandbox} -d ${SANDBOX_POSTGRES_DB:-dbzenith_sandbox}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dbzenith-backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-DBZenith}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dbzenith}:${POSTGRES_PASSWORD:-change_me_dev_only}@db:5432/${POSTGRES_DB:-dbzenith}
      SANDBOX_DATABASE_URL: postgresql+psycopg://${SANDBOX_POSTGRES_USER:-dbzenith_sandbox}:${SANDBOX_POSTGRES_PASSWORD:-change_me_sandbox_only}@sandbox-db:5432/${SANDBOX_POSTGRES_DB:-dbzenith_sandbox}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - app_net
      - sandbox_net
    depends_on:
      db:
        condition: service_healthy
      sandbox-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  workload:
    image: postgres:17-alpine
    profiles: ["workload"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-change_me_dev_only}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net
    volumes:
      - ./sandbox/workload.sql:/workload.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["until pg_isready -h db -U ${POSTGRES_USER:-dbzenith} -d ${POSTGRES_DB:-dbzenith}; do sleep 1; done; psql -h db -U ${POSTGRES_USER:-dbzenith} -d ${POSTGRES_DB:-dbzenith} -v ON_ERROR_STOP=1 -f /workload.sql"]
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: dbzenith-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - app_net
    depends_on:
      backend:
        condition: service_healthy

networks:
  app_net:
    driver: bridge
  sandbox_net:
    driver: bridge
    internal: true

volumes:
  db_data:
  sandbox_db_data:
